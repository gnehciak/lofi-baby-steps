<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f4ead5"/>

  <!-- Soft gradient washes -->
  <defs>
    <radialGradient id="rose" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#c98a8a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c98a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#7d9b76" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7d9b76" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.23 0 0 0 0 0.16 0 0 0 0 0.11 0 0 0 0.08 0"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#rose)"/>
  <rect width="1200" height="630" fill="url(#sage)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.5"/>

  <!-- Tag pills -->
  <g font-family="Inter, sans-serif" font-weight="600" font-size="20" fill="#5a4636">
    <rect x="80" y="80" width="148" height="38" rx="19" fill="#ebdfc3"/>
    <text x="154" y="105" text-anchor="middle">Stage 4</text>
    <rect x="240" y="80" width="160" height="38" rx="19" fill="#ebdfc3"/>
    <text x="320" y="105" text-anchor="middle">Composition</text>
    <rect x="412" y="80" width="170" height="38" rx="19" fill="#ebdfc3"/>
    <text x="497" y="105" text-anchor="middle">Lo-fi hip-hop</text>
    <rect x="594" y="80" width="118" height="38" rx="19" fill="#ebdfc3"/>
    <text x="653" y="105" text-anchor="middle">BandLab</text>
  </g>

  <!-- Title -->
  <g font-family="Fraunces, Georgia, serif" fill="#3a2a1c">
    <text x="80" y="270" font-size="100" font-weight="800" letter-spacing="-2">Make your first</text>
    <text x="80" y="380" font-size="100" font-weight="800" letter-spacing="-2">lo-fi beat.</text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="Inter, sans-serif" font-size="28" fill="#5a4636" font-weight="400">
    Four small steps. No music theory required.
  </text>

  <!-- Vinyl record on the right -->
  <g transform="translate(950, 315)">
    <circle r="195" fill="#1a1410"/>
    <circle r="195" fill="none" stroke="#3a2a1c" stroke-width="2" opacity="0.6"/>
    <!-- vinyl grooves -->
    <g fill="none" stroke="#f4ead5" stroke-width="0.6" opacity="0.18">
      <circle r="180"/>
      <circle r="170"/>
      <circle r="160"/>
      <circle r="150"/>
      <circle r="140"/>
      <circle r="130"/>
      <circle r="120"/>
      <circle r="110"/>
      <circle r="100"/>
      <circle r="90"/>
    </g>
    <!-- label -->
    <circle r="70" fill="#c98a8a"/>
    <circle r="70" fill="none" stroke="#3a2a1c" stroke-width="2"/>
    <circle r="6" fill="#1a1410"/>
    <text y="-30" text-anchor="middle" font-family="Fraunces, serif" font-size="14" font-weight="700" fill="#3a2a1c" letter-spacing="3">SLEEPY</text>
    <text y="40" text-anchor="middle" font-family="Fraunces, serif" font-size="14" font-weight="700" fill="#3a2a1c" letter-spacing="3">CAFÉ</text>
  </g>

  <!-- Footer brand line -->
  <g transform="translate(80, 560)">
    <circle cx="10" cy="0" r="9" fill="#c98a8a"/>
    <text x="32" y="6" font-family="Fraunces, serif" font-size="22" font-weight="700" fill="#3a2a1c">Lo-Fi Baby Steps</text>
    <text x="240" y="6" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#5a4636">· an interactive composition guide</text>
  </g>
</svg>
